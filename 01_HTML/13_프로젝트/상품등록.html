<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 등록</title>
    <link rel="stylesheet" href="상품등록.css" />
</head>
<body>
    <form action="/product" method="get">
		
		<label for="name">상품명</label> 
		<input type="text" name="product_name"><br>
        <label for="code">상품명</label> 
		<input type="number" name="product_code"><br>
			
                 <label>상품상태</label> 
			       <input type="radio" name="choice" value="예약가능" id="choice1" checked />
			        <label for="man">예약가능</label>
					<input type="radio" name="choice" value="출발가능" id="choice2" checked />
					<label for="man">출발가능</label>
					<input type="radio" name="choice" value="견적가능" id="choice3" checked />
					<label for="man">견적가능</label>
					<input type="radio" name="choice" value="예약마감" id="choice4" checked />
					<label for="man">예약마감</label>
					<br>
			<!-- 콤보박스-->
             <label>상품구성</label> 
			 <div class="controlgroup">
						<select id="package">
							<option>일정별 구성</option>
							<option>출발일 구성</option>
							
						</select>
	
						<br>

              <label>통화</label> 
			 <div class="controlgroup">
				<select id="package">
					<option>한국 KRW</option>
					<option>미국 USD</option>
					<option>일본 JPY</option>
					
				</select>
				<br>
            <div class="inline">
			<label for="adult_price">성인 요금</label>
            <input type="number" id="adult_price" name="adult_price" required></div>
             <div class="inline">
            <label for="child_price">아동 요금</label>
            <input type="number" id="child_price" name="child_price"></div>
             <div class="inline">
            <label for="infant_price">유아 요금</label>
            <input type="number" id="infant_price" name="infant_price"></div>
            <div class="inline"></div>
            <label for="points">적립 포인트</label>
            <input type="number" id="points" name="points"></div>
			
          
			<!-- 체크박스-->
			 <label>예약가능요일</label> 
                    <input type="checkbox" id="date" name="reservation" value="travel" />
			        <label for="travel">제한없음</label>
					<input type="checkbox" id="mon" name="reservation" value="travel" />
					<label for="travel">월</label>
					<input type="checkbox" id="tue"" name="reservation" value="travel" />
					<label for="travel">화</label>
					<input type="checkbox" id="wed" name="reservation" value="travel" />
					<label for="travel">수</label>
					<input type="checkbox" id="thu" name="reservation" value="travel" />
					<label for="travel">목</label>
					<input type="checkbox" id="fri" name="reservation" value="travel" />
					<label for="travel">금</label>
					<input type="checkbox" id="sat" name="reservation" value="travel" />
					<label for="travel">토</label>
					<input type="checkbox" id="sun" name="reservation" value="travel" />
					<label for="travel">일</label>					
			<br>
			<!-- 콤보박스-->
              <label>예약일 선택제한</label> 
			 <div class="controlgroup">
							<select id="datechoice">
							<option>사용안함</option>
							<option>날짜설정</option>
							</select>
							
			
			<h4>상품정보</h4>
            <label>항목명</label> 
            <label>상세내용</label> 
			<br>
			 <label for="icon">아이콘</label> <br>
			    <ol id="selectable">
				<li class="ui-widget-content">특가</li>
				<li class="ui-widget-content">인기</li>
				<li class="ui-widget-content">조기예약할인</li>
				<li class="ui-widget-content">베스트상품</li>
				<li class="ui-widget-content">마감임박</li>
				</ol>

                 <label for="label">라벨</label> <br>
		          <ol id="selectable">
			      <li class="ui-widget-content">특가/특전</li>
			      <li class="ui-widget-content">TOP1</li>
				  <li class="ui-widget-content">TOP2</li>
				  <li class="ui-widget-content">TOP3</li>
				  <li class="ui-widget-content">여분</li>
						</ol>            
		   <label for="leader">인솔자</label> <br>
           <label for="guide">가이드</label> <br>
           <label for="min-people">최소출발인원</label><br>
           <label for="description1">간략설명</label>
          
           		
		   <h4>상세설정</h4>
            <label for="main_image">대표이미지</label>
		    <input type="file" value="이미지등록"><br>
            <label for="detail_image">상세이미지</label>
		    <input type="file" value="이미지등록"><br>
            <label for="description">상세설명</label>
		  
		   
		   <h4>관리정보</h4>
           <label for="admin_memo">관리자 메모</label>
		  
		   
		   <br>

		   <input type="submit" value="설정을 저장합니다">
		   <input type="submit" value="목록보기">
			
			</form>
			
</body>
</html>
